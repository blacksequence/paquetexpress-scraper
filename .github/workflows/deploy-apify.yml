name: Deploy to Apify

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  push-to-apify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Deploy actor to Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: npx -y apify-cli@latest push --force
